<svg xmlns="http://www.w3.org/2000/svg" width="880" height="256" viewBox="0 0 880 256" role="img" aria-label="Hermes Agent Olympian — Let Him Cook">
  <defs>
    <linearGradient id="tealBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f2c94c" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="tealAura" cx="18%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#67e8f9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#041c1c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flameAura" cx="50%" cy="44%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#071f1e" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Hermes Teal Base -->
  <rect x="1" y="1" width="878" height="254" fill="#041c1c"/>
  <rect x="1" y="1" width="878" height="254" fill="url(#tealAura)"/>
  <rect x="1" y="1" width="878" height="254" fill="none" stroke="url(#tealBorder)" stroke-width="1.3"/>

  <!-- Left Emblem Box -->
  <rect x="22" y="22" width="190" height="212" fill="#072120" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="117" cy="96" r="66" fill="url(#flameAura)"/>
  <g transform="translate(75, 50) scale(3.5)" fill="none" stroke="#c084fc" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
  </g>
  <!-- 5 Tier Squares (Hermes style) -->
  <g transform="translate(55, 166)">
    <rect x="4" y="-5" width="10" height="10" fill="#b87333"/>
    <line x1="17" y1="0" x2="29" y2="0" stroke="#455855" stroke-width="1.3"/>
    <rect x="32" y="-5" width="10" height="10" fill="#c0c7d2"/>
    <line x1="45" y1="0" x2="57" y2="0" stroke="#455855" stroke-width="1.3"/>
    <rect x="60" y="-5" width="10" height="10" fill="#f2c94c"/>
    <line x1="73" y1="0" x2="85" y2="0" stroke="#455855" stroke-width="1.3"/>
    <rect x="88" y="-5" width="10" height="10" fill="#67e8f9"/>
    <line x1="101" y1="0" x2="113" y2="0" stroke="#c084fc" stroke-width="1.5"/>
    <rect x="114" y="-7" width="14" height="14" fill="#c084fc" filter="url(#softGlow)"/>
  </g>
  <text x="117" y="199" text-anchor="middle" fill="#ffe6cb" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2">MAX RANK UNLOCKED</text>
  <text x="117" y="217" text-anchor="middle" fill="#a89885" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="10" letter-spacing="0.9">HERMES TEAL · TIER 5/5</text>

  <!-- Right Column -->
  <text x="238" y="44" fill="#b8a894" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.5">AGENT AUTONOMY  ·  HERMES AGENT v0.20.5</text>
  <text x="852" y="44" text-anchor="end" fill="#c084fc" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1">◆ UNLOCKED</text>

  <text x="238" y="90" fill="#ffe6cb" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="33" font-weight="800">Let Him Cook</text>
  <rect x="488" y="64" width="144" height="28" fill="#c084fc" fill-opacity="0.14" stroke="#c084fc" stroke-width="1.2"/>
  <text x="560" y="82.5" text-anchor="middle" fill="#e9d5ff" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2">OLYMPIAN TIER</text>

  <text x="238" y="121" fill="#d9c6b0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5">Let Hermes run a serious autonomous tool chain in one session.</text>

  <line x1="238" y1="142" x2="852" y2="142" stroke="#2c3e3b" stroke-width="1"/>

  <!-- 4 Stat Tiles -->
  <g transform="translate(238, 158)">
    <rect x="0" y="0" width="144" height="74" fill="#072120" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1"/>
    <text x="16" y="34" fill="#c084fc" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="22" font-weight="800">OLYMPIAN</text>
    <text x="16" y="56" fill="#b8a894" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12">Highest Tier</text>

    <rect x="157" y="0" width="144" height="74" fill="#072120" stroke="#314441" stroke-width="1"/>
    <text x="173" y="34" fill="#ffe6cb" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="22" font-weight="800">51 / 60</text>
    <text x="173" y="56" fill="#b8a894" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12">Badges Unlocked</text>

    <rect x="314" y="0" width="144" height="74" fill="#072120" stroke="#314441" stroke-width="1"/>
    <text x="330" y="34" fill="#f2c94c" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="22" font-weight="800">12 / 37</text>
    <text x="330" y="56" fill="#b8a894" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12">Providers / Models</text>

    <rect x="471" y="0" width="143" height="74" fill="#072120" stroke="#314441" stroke-width="1"/>
    <text x="487" y="34" fill="#67e8f9" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="22" font-weight="800">1,376</text>
    <text x="487" y="56" fill="#b8a894" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12">Tool Calls</text>
  </g>
</svg>
