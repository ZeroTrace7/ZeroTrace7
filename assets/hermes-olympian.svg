<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-label="Hermes Agent Olympian Bento Command Strip">
  <defs>
    <radialGradient id="bentoGlow" cx="28%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#67e8f9" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#041c1c" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="269" fill="#041c1c" stroke="#2c3e3b" stroke-width="1"/>
  <rect x="0.5" y="0.5" width="879" height="269" fill="url(#bentoGlow)"/>

  <!-- Left Bento Column: Stacked Olympian Badges -->
  <text x="24" y="34" fill="#b8a894" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" letter-spacing="1.8">NOUS RESEARCH · HERMES AGENT</text>
  <text x="24" y="64" fill="#ffe6cb" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">Olympian Hall of Fame</text>

  <!-- Row Card 1: Let Him Cook -->
  <g transform="translate(24, 82)">
    <rect x="0" y="0" width="528" height="78" fill="#08201f" stroke="#c084fc" stroke-opacity="0.7" stroke-width="1.2"/>
    <g transform="translate(18, 20) scale(1.5)" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
      <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
    </g>
    <text x="68" y="33" fill="#ffe6cb" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Let Him Cook</text>
    <text x="68" y="55" fill="#c7b59e" font-family="system-ui, sans-serif" font-size="12.5">Autonomous tool chains in a single session · Agent Autonomy</text>
    <rect x="422" y="14" width="90" height="22" fill="#c084fc" fill-opacity="0.16" stroke="#c084fc"/>
    <text x="467" y="29" text-anchor="middle" fill="#e9d5ff" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">OLYMPIAN</text>
    <text x="467" y="55" text-anchor="middle" fill="#c084fc" font-family="ui-monospace, monospace" font-size="10">◆ UNLOCKED</text>
  </g>

  <!-- Row Card 2: Skill Issue? Skill Created. -->
  <g transform="translate(24, 172)">
    <rect x="0" y="0" width="528" height="78" fill="#08201f" stroke="#c084fc" stroke-opacity="0.7" stroke-width="1.2"/>
    <g transform="translate(18, 20) scale(1.5)" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
      <path d="M7 10H6a4 4 0 0 1-4-4 1 1 0 0 1 1-1h4"/><path d="M7 5a1 1 0 0 1 1-1h13a1 1 0 0 1 1 1 7 7 0 0 1-7 7H8a1 1 0 0 1-1-1z"/><path d="M9 12v5"/><path d="M15 12v5"/><path d="M5 20a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3 1 1 0 0 1-1 1H6a1 1 0 0 1-1-1"/>
    </g>
    <text x="68" y="33" fill="#ffe6cb" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Skill Issue? Skill Created.</text>
    <text x="68" y="55" fill="#c7b59e" font-family="system-ui, sans-serif" font-size="12.5">Create or patch durable procedures · Hermes Native</text>
    <rect x="422" y="14" width="90" height="22" fill="#c084fc" fill-opacity="0.16" stroke="#c084fc"/>
    <text x="467" y="29" text-anchor="middle" fill="#e9d5ff" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">OLYMPIAN</text>
    <text x="467" y="55" text-anchor="middle" fill="#c084fc" font-family="ui-monospace, monospace" font-size="10">◆ UNLOCKED</text>
  </g>

  <!-- Right Column: Gamerscore Matrix -->
  <g transform="translate(570, 22)">
    <rect x="0" y="0" width="286" height="228" fill="#071f1e" stroke="#2f4340" stroke-width="1"/>
    <text x="20" y="30" fill="#b8a894" font-family="ui-monospace, monospace" font-size="10.5" letter-spacing="1.4">GAMERSCORE TELEMETRY</text>
    <text x="20" y="66" fill="#c084fc" font-family="system-ui, sans-serif" font-size="28" font-weight="800">Tier: Olympian</text>
    <line x1="20" y1="84" x2="266" y2="84" stroke="#253835" stroke-width="1"/>

    <text x="20" y="112" fill="#b8a894" font-family="ui-monospace, monospace" font-size="11">BADGES UNLOCKED</text>
    <text x="266" y="112" text-anchor="end" fill="#ffe6cb" font-family="ui-monospace, monospace" font-size="14" font-weight="700">51 / 60</text>

    <text x="20" y="142" fill="#b8a894" font-family="ui-monospace, monospace" font-size="11">AI PROVIDERS</text>
    <text x="266" y="142" text-anchor="end" fill="#c084fc" font-family="ui-monospace, monospace" font-size="14" font-weight="700">12 / 12</text>

    <text x="20" y="172" fill="#b8a894" font-family="ui-monospace, monospace" font-size="11">DISTINCT MODELS</text>
    <text x="266" y="172" text-anchor="end" fill="#f2c94c" font-family="ui-monospace, monospace" font-size="14" font-weight="700">37</text>

    <text x="20" y="202" fill="#b8a894" font-family="ui-monospace, monospace" font-size="11">AGENT SESSIONS</text>
    <text x="266" y="202" text-anchor="end" fill="#67e8f9" font-family="ui-monospace, monospace" font-size="14" font-weight="700">243</text>
  </g>
</svg>
