<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" role="img" aria-label="Hermes Agent Olympian Tier — Provider Polyglot">
  <defs>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="olympianGlow" cx="20%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#1a1b27" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iconAura" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0f111a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main Tokyo Night background -->
  <rect x="1" y="1" width="858" height="248" rx="14" fill="#1a1b27"/>
  <rect x="1" y="1" width="858" height="248" rx="14" fill="url(#olympianGlow)"/>
  <rect x="1" y="1" width="858" height="248" rx="14" fill="none" stroke="url(#cardBorder)" stroke-width="1.5" stroke-opacity="0.75"/>

  <!-- Left Emblem Panel -->
  <rect x="24" y="24" width="184" height="202" rx="12" fill="#0f111a" stroke="#c084fc" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="116" cy="96" r="66" fill="url(#iconAura)"/>

  <!-- Hermes Provider Polyglot (Lucide swap icon) -->
  <g transform="translate(74, 52) scale(3.5)" fill="none" stroke="#c084fc" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <path d="m17 2 4 4-4 4"/>
    <path d="M3 11v-1a4 4 0 0 1 4-4h14"/>
    <path d="m7 22-4-4 4-4"/>
    <path d="M21 13v1a4 4 0 0 1-4 4H3"/>
  </g>

  <!-- Tier Progression Dots: Copper -> Silver -> Gold -> Diamond -> Olympian -->
  <g transform="translate(64, 166)">
    <circle cx="10" cy="0" r="5" fill="#b87333"/>
    <line x1="17" y1="0" x2="29" y2="0" stroke="#3b4261" stroke-width="1.5"/>
    <circle cx="36" cy="0" r="5" fill="#c0c7d2"/>
    <line x1="43" y1="0" x2="55" y2="0" stroke="#3b4261" stroke-width="1.5"/>
    <circle cx="62" cy="0" r="5" fill="#f2c94c"/>
    <line x1="69" y1="0" x2="81" y2="0" stroke="#3b4261" stroke-width="1.5"/>
    <circle cx="88" cy="0" r="5" fill="#67e8f9"/>
    <line x1="95" y1="0" x2="107" y2="0" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="114" cy="0" r="6.5" fill="#c084fc" filter="url(#softGlow)"/>
  </g>
  <text x="116" y="196" text-anchor="middle" fill="#e9d5ff" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2">MAX RANK UNLOCKED</text>
  <text x="116" y="213" text-anchor="middle" fill="#787c99" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="10" letter-spacing="0.8">TIER 5 OF 5</text>

  <!-- Right Column Header -->
  <text x="234" y="44" fill="#9aa5ce" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.5">MODEL LORE  ·  HERMES AGENT v0.20.5</text>
  <text x="834" y="44" text-anchor="end" fill="#c084fc" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1">◆ UNLOCKED</text>

  <!-- Title + Olympian Pill -->
  <text x="234" y="88" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800">Provider Polyglot</text>
  <rect x="536" y="63" width="136" height="28" rx="6" fill="#c084fc" fill-opacity="0.14" stroke="#c084fc" stroke-width="1.2"/>
  <text x="604" y="81.5" text-anchor="middle" fill="#e9d5ff" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.1">OLYMPIAN TIER</text>

  <!-- Description -->
  <text x="234" y="118" fill="#a9b1d6" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5">Use models from multiple providers across Hermes history.</text>

  <!-- Subtle Divider -->
  <line x1="234" y1="138" x2="834" y2="138" stroke="#2f334d" stroke-width="1"/>

  <!-- 4 Stat Cards -->
  <g transform="translate(234, 154)">
    <rect x="0" y="0" width="140" height="72" rx="10" fill="#131420" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1"/>
    <text x="16" y="33" fill="#c084fc" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="22" font-weight="800">12 / 12</text>
    <text x="16" y="55" fill="#9aa5ce" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">AI Providers</text>

    <rect x="153" y="0" width="140" height="72" rx="10" fill="#131420" stroke="#7aa2f7" stroke-opacity="0.28" stroke-width="1"/>
    <text x="169" y="33" fill="#7aa2f7" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="22" font-weight="800">37</text>
    <text x="169" y="55" fill="#9aa5ce" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Distinct Models</text>

    <rect x="306" y="0" width="140" height="72" rx="10" fill="#131420" stroke="#f2c94c" stroke-opacity="0.28" stroke-width="1"/>
    <text x="322" y="33" fill="#f2c94c" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="22" font-weight="800">19 / 60</text>
    <text x="322" y="55" fill="#9aa5ce" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Badges Earned</text>

    <rect x="459" y="0" width="141" height="72" rx="10" fill="#131420" stroke="#73daca" stroke-opacity="0.28" stroke-width="1"/>
    <text x="475" y="33" fill="#73daca" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="22" font-weight="800">243</text>
    <text x="475" y="55" fill="#9aa5ce" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Agent Sessions</text>
  </g>
</svg>
