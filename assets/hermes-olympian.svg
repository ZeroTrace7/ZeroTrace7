<svg xmlns="http://www.w3.org/2000/svg" width="880" height="292" viewBox="0 0 880 292" role="img" aria-label="Hermes Agent Olympian Bento Command Strip">
  <defs>
    <radialGradient id="bentoGlow" cx="28%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#67e8f9" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#041c1c" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="291" fill="#041c1c" stroke="#2c3e3b" stroke-width="1"/>
  <rect x="0.5" y="0.5" width="879" height="291" fill="url(#bentoGlow)"/>

