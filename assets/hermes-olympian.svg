    <text x="20" y="32" fill="#b8a894" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="11.5" letter-spacing="1.4">GAMERSCORE TELEMETRY</text>
    <text x="20" y="72" fill="#c084fc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800">Tier: Olympian</text>
    <line x1="20" y1="92" x2="262" y2="92" stroke="#253835" stroke-width="1"/>

    <text x="20" y="124" fill="#b8a894" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="12">BADGES UNLOCKED</text>
    <text x="262" y="124" text-anchor="end" fill="#ffe6cb" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="16" font-weight="700">51 / 60</text>

    <text x="20" y="158" fill="#b8a894" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="12">AI PROVIDERS</text>
    <text x="262" y="158" text-anchor="end" fill="#c084fc" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="16" font-weight="700">12 / 12</text>

    <text x="20" y="192" fill="#b8a894" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="12">DISTINCT MODELS</text>
    <text x="262" y="192" text-anchor="end" fill="#f2c94c" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="16" font-weight="700">37</text>

    <text x="20" y="226" fill="#b8a894" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="12">AGENT SESSIONS</text>
    <text x="262" y="226" text-anchor="end" fill="#67e8f9" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="16" font-weight="700">243</text>
