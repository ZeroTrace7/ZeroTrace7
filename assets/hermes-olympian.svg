    <text x="468" y="61" text-anchor="middle" fill="#c084fc" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="11" font-weight="600">◆ UNLOCKED</text>
  </g>

  <!-- Row Card 2: Skill Issue? Skill Created. -->
  <g transform="translate(24, 186)">
    <rect x="0" y="0" width="532" height="86" fill="#08201f" stroke="#c084fc" stroke-opacity="0.72" stroke-width="1.25"/>
    <g transform="translate(18, 22) scale(1.7)" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
      <path d="M7 10H6a4 4 0 0 1-4-4 1 1 0 0 1 1-1h4"/><path d="M7 5a1 1 0 0 1 1-1h13a1 1 0 0 1 1 1 7 7 0 0 1-7 7H8a1 1 0 0 1-1-1z"/><path d="M9 12v5"/><path d="M15 12v5"/><path d="M5 20a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3 1 1 0 0 1-1 1H6a1 1 0 0 1-1-1"/>
