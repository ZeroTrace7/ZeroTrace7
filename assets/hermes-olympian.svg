    <rect x="420" y="16" width="96" height="24" fill="#c084fc" fill-opacity="0.16" stroke="#c084fc" stroke-width="1.1"/>
    <text x="468" y="32" text-anchor="middle" fill="#e9d5ff" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="700">OLYMPIAN</text>
    <text x="468" y="61" text-anchor="middle" fill="#c084fc" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="11" font-weight="600">◆ UNLOCKED</text>
  </g>

  <!-- Right Column: Gamerscore Matrix -->
  <g transform="translate(574, 22)">
