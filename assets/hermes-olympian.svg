  <text x="24" y="68" fill="#ffe6cb" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="29" font-weight="800">Olympian Hall of Fame</text>

  <!-- Row Card 1: Let Him Cook -->
  <g transform="translate(24, 88)">
    <rect x="0" y="0" width="532" height="86" fill="#08201f" stroke="#c084fc" stroke-opacity="0.72" stroke-width="1.25"/>
    <g transform="translate(18, 22) scale(1.7)" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
      <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
    </g>
    <text x="72" y="36" fill="#ffe6cb" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Let Him Cook</text>
    <text x="72" y="60" fill="#c7b59e" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5">Autonomous tool chains in one session · Agent Autonomy</text>
    <rect x="420" y="16" width="96" height="24" fill="#c084fc" fill-opacity="0.16" stroke="#c084fc" stroke-width="1.1"/>
